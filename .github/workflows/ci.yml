name: CI/CD

# Pull requests into develop/main run every gate: lint, type check and build;
# unit and integration tests with a coverage floor; browser tests (offline and
# accessibility); dependency audit; secret scan.
# Draft PRs run only the fast gates (build, unit and integration tests); marking
# a PR ready for review runs CI again with every gate.
# Push to develop (merged PR): all gates, then a Vercel preview deployment.
# Push to main (merged release PR): all gates, then the tested export goes to a
# staged Vercel production deployment, smoke and health checks run on it, the
# owner approves, it is promoted to production, and the release is tagged.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deployment in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build (static export + service worker)
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Verify export
        run: |
          test ! -e out/system.html
          test ! -e out/iframe.html
          test -f out/index.html
          test -f out/offline.html
          test -f out/sw.js
          test -f out/manifest.webmanifest
          test -f out/version.json

      - name: Upload export for browser tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          retention-days: 1
          if-no-files-found: error

  tests:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Browser tests (offline + a11y)
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      # Every Storybook story rendered in Chromium; any axe violation fails.
      - name: Story tests (components + a11y)
        run: npm run test:storybook

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A hotfix is a PR from hotfix/*, or the push to main that merged one.
      - name: Detect hotfix
        id: hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_ref=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            head_ref="$PR_HEAD_REF"
          elif [ "$REF_NAME" = "main" ]; then
            head_ref=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.ref // ""')
          fi
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "is_hotfix=$(REF="$head_ref" node scripts/is-hotfix.mjs)" >> "$GITHUB_OUTPUT"

      # Fails on high or critical advisories in production and dev dependencies.
      # Only a hotfix may pass with a failing audit, and it is always annotated.
      - name: Audit dependencies
        env:
          IS_HOTFIX: ${{ steps.hotfix.outputs.is_hotfix }}
          HOTFIX_REF: ${{ steps.hotfix.outputs.head_ref }}
        run: |
          if npm audit --audit-level=high; then
            exit 0
          fi
          if [ "$IS_HOTFIX" = "true" ]; then
            echo "::warning::Dependency audit bypassed for hotfix $HOTFIX_REF"
            echo "Dependency audit bypassed for hotfix $HOTFIX_REF" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1

  secrets:
    name: Secret scan
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_REF: ${{ github.base_ref }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan the commits being introduced
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            range=""
          fi
          echo "Scanning range: ${range:-full history}"
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            ${range:+--log-opts="$range"} \
            .

      - name: Upload redacted report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore

  preview:
    name: Deploy preview
    needs: [checks, tests, e2e, audit, secrets]
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip when Vercel secrets are missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::warning::Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are not set; skipping deployment."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        with:
          node-version-file: .nvmrc

      # The artifact the browser tests ran against, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        with:
          name: out
          path: out

      - name: Build Output from out/
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: node scripts/vercel-output.mjs

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npm install --global vercel@65.15.0

      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  # Staged production deployment: built from the tested artifact, not on the
  # production domain yet. `production` promotes it after smoke and approval.
  staging:
    name: Deploy staging
    needs: [checks, tests, e2e, audit, secrets]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require Vercel secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; cannot deploy to production."
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out

      - name: Build Output from out/
        run: node scripts/vercel-output.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@65.15.0

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy (staged, not on the production domain)
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging deployment: $url" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke & health (staging)
    needs: staging
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # No Playwright report or trace artifacts are uploaded from this job: they
      # record request headers, and the bypass secret travels in one.
      - name: Smoke and health checks
        env:
          SMOKE_BASE_URL: ${{ needs.staging.outputs.url }}
          EXPECTED_SHA: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:smoke

  production:
    name: Promote to production
    needs: [staging, smoke]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Waits for the required reviewer (the owner) before any step runs.
    # No job-level concurrency group: the workflow-level group already
    # serializes main runs.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require Vercel secrets and production URL
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; cannot promote to production."
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Promotes through the REST API: `vercel promote` loads the token's user first and
      # fails with "User not found (404)" for this token. Assigns the production domains
      # to the already-built staging deployment (nothing is rebuilt), then waits until
      # the production domain serves this commit.
      - name: Promote staging deployment
        env:
          STAGING_URL: ${{ needs.staging.outputs.url }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/vercel-promote.mjs

      # The health spec only makes HTTP requests, so no browser is installed.
      - name: Health check on the production domain
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/health.spec.ts

  release:
    name: Tag release
    needs: production
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(node scripts/release-tag.mjs)
          gh release create "$tag" --target "$RELEASE_SHA" --generate-notes --title "$tag"
          release_url=$(gh release view "$tag" --json url --jq .url)
          {
            echo "### Released $tag"
            echo
            echo "Release: $release_url"
            echo
            echo "Sync \`main\` back into \`develop\` (merge commit, never squash):"
            echo
            echo '```sh'
            echo "gh pr create --base develop --head main --title \"chore(release): sync main into develop\" --body \"Sync after $tag.\""
            echo "gh pr merge <number> --merge"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
