name: PR conventions

# Checks the PR title (Conventional Commits), the branch name and the allowed
# source branch for the base, and that a changed UI component comes with a story
# (or the `no-story-needed` label). Runs on drafts too: it is cheap.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check title and branches
        run: node scripts/check-pr.mjs

      - name: Check UI components have a story
        run: node scripts/check-ui-stories.mjs
